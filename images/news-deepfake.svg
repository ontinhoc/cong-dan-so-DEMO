<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311025"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="680" cy="120" r="280" fill="url(#glow)"/>

  <!-- Decorative circuit lines -->
  <path d="M 500,450 L 560,340 L 700,340 L 750,260 L 800,260" fill="none" stroke="#ef4444" stroke-width="2" stroke-opacity="0.4"/>
  <path d="M 450,450 L 510,380 L 640,380" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="560" cy="340" r="5" fill="#ef4444"/>
  <circle cx="750" cy="260" r="5" fill="#f97316"/>

  <!-- Phone frame for Fake Video Call -->
  <g transform="translate(540, 75)">
    <rect width="210" height="300" rx="24" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <rect x="12" y="16" width="186" height="268" rx="14" fill="#090d16"/>
    
    <!-- Video silhouette / avatar -->
    <circle cx="105" cy="110" r="42" fill="#334155"/>
    <circle cx="105" cy="98" r="22" fill="#64748b"/>
    <path d="M 75,145 Q 105,125 135,145 Z" fill="#64748b"/>

    <!-- Fake AI mesh points -->
    <circle cx="95" cy="95" r="3" fill="#22d3ee"/>
    <circle cx="115" cy="95" r="3" fill="#22d3ee"/>
    <circle cx="105" cy="105" r="3" fill="#ef4444"/>
    <line x1="95" y1="95" x2="115" y2="95" stroke="#22d3ee" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="95" y1="95" x2="105" y2="105" stroke="#ef4444" stroke-width="1"/>
    <line x1="115" y1="95" x2="105" y2="105" stroke="#ef4444" stroke-width="1"/>

    <!-- Warning overlay on phone -->
    <rect x="25" y="195" width="160" height="42" rx="8" fill="#ef4444" fill-opacity="0.9"/>
    <text x="105" y="215" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">⚠️ GIẢ MẠO CÔNG AN</text>
    <text x="105" y="228" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">HỐI THÚC CHUYỂN TIỀN</text>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(50, 110)">
    <!-- Warning Badge -->
    <rect width="185" height="32" rx="16" fill="url(#redGrad)"/>
    <text x="92" y="21" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12.5" text-anchor="middle" letter-spacing="0.5">⚠️ CẢNH BÁO TỘI PHẠM</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="34">THỦ ĐOẠN LỪA ĐẢO</text>
    <text x="0" y="130" fill="#fca5a5" font-family="sans-serif" font-weight="800" font-size="34">VIDEO GỌI DEEPFAKE</text>

    <!-- Subtitle -->
    <text x="0" y="178" fill="#cbd5e1" font-family="sans-serif" font-size="16" font-weight="500">Giả danh cán bộ Công an, Viện kiểm sát gọi điện đe dọa</text>
    <text x="0" y="204" fill="#94a3b8" font-family="sans-serif" font-size="14">Cơ quan Công an không bao giờ làm việc hay yêu cầu chuyển tiền qua điện thoại!</text>

    <!-- Hot button banner -->
    <g transform="translate(0, 235)">
      <rect width="280" height="38" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="15" y="24" fill="#fef08a" font-family="sans-serif" font-weight="bold" font-size="13">📞 Trực ban Công an: 02693.599.699</text>
    </g>
  </g>
</svg>
